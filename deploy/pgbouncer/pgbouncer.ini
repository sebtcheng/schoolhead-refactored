[pgbouncer]

;;;
;;; Administrative settings
;;;

logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

;;;
;;; Where to wait for clients
;;;

listen_addr = *
listen_port = 6432

;;;
;;; Authentication settings
;;;

auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

;;;
;;; Users allowed to do PAUSE, RESUME, RELOAD, etc.
;;;

admin_users = Administrator1, postgres

;;;
;;; Pooler behavior
;;;

pool_mode = transaction
server_reset_query = DISCARD ALL
max_client_conn = 10000
default_pool_size = 150
reserve_pool_size = 20

;;;
;;; [OPTIMIZATION] Prepared Statement Support
;;; Enables PgBouncer to manage prepared statements across connections in transaction mode.
;;; Required version: 1.21+ (Current: 1.22.0)
;;;
max_prepared_statements = 200

;;;
;;; Connection limits
;;;

max_db_connections = 100
max_user_connections = 100

;;;
;;; Logging
;;;

log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;;;
;;; TCP settings
;;;

tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 10
