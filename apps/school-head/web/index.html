  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>insighted</title>
  <script>
    // Fail-safe: Redirect clean URLs to static guide indices if Nginx fallback triggers
    const guidePaths = ['/School-Head', '/Division-Engineer', '/EFD-Engineer'];
    const currentPath = window.location.pathname.replace(/\/$/, "");
    if (guidePaths.includes(currentPath)) {
      window.location.replace(currentPath + '/index.html');
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
