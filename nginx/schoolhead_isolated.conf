# --- [Isolated School Head Portal] ---
location /insighted-schoolhead/ {
    alias /var/www/html/InsightEd-Mobile-PWA/schoolhead/dist/;
    try_files $uri $uri/ /insighted-schoolhead/index.html;

    # No-Cache for index.html to ensure PWA updates
    location ~* /insighted-schoolhead/index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}

location /insighted-schoolhead/api/ {
    proxy_pass http://127.0.0.1:5010/api/;
    
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
