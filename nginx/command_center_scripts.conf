# 🚀 Command Center Script Orchestrator Nginx Configuration
# Add these blocks to your main stride.conf server block (Listen 443)

location /command-center/ {
    alias /var/www/html/command-center-tools/;
    try_files $uri $uri/ /command-center/index.html;

    # Anti-Cache Defense
    location ~* /command-center/index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}

location /command-center/api/ {
    proxy_pass http://127.0.0.1:3006/;
    
    # SSE Support (Crucial for log streaming)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    
    # Disable buffering for SSE
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    
    # Extended timeouts for long-running scripts
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
