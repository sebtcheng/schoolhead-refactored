# 🚀 InsightEd HQ Optimized Nginx Configuration
# Add these blocks to your main stride.conf server block (Listen 443)

# -----------------------------------------
# FRONTEND: Standalone SPA (InsightEd HQ)
# -----------------------------------------
location /insighted-hq/ {
    alias /var/www/html/command-center/dist/;
    try_files $uri $uri/ /insighted-hq/index.html;

    # [Layer 1] Nginx Cache Hardening (nginx-pro.md)
    # Force revalidation for index.html
    location ~* /insighted-hq/index\.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}

# -----------------------------------------
# BACKEND: Reverse Proxy to HQ API
# -----------------------------------------
location /insighted-hq/api/ {
    proxy_pass http://127.0.0.1:3005/;
    
    # [Senior SDE Standard] Header Forwarding
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    
    # Optimization: Proxy timeout adjustments
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}
