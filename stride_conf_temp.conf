# =============================================================================
# InsightEd / STRIDE ΓÇö Nginx Virtual Host Configuration
# Optimized for high concurrency: upstream keepalive + binary asset micro-cache
# =============================================================================

# ---------------------------------------------------------------------------
# Upstream pools ΓÇö keepalive 32 reuses TCP connections across requests
# ---------------------------------------------------------------------------
upstream stride_backend {
    server 127.0.0.1:3002;
    keepalive 64; # Increased from 32
}

upstream opdash_backend {
    server 127.0.0.1:3001;
    keepalive 64; # Increased from 32
}

upstream staging_backend {
    server 127.0.0.1:5000;
    keepalive 64; # Increased from 32
}

upstream production_backend {
    server 127.0.0.1:5000;
    keepalive 256; # Doubled from 128
}

# ---------------------------------------------------------------------------
# HTTP ΓåÆ HTTPS redirect
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name stride.deped.gov.ph;
    client_max_body_size 100M;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# Main HTTPS server
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2 default_server;
    server_name stride.deped.gov.ph;
    client_max_body_size 100M;

    ssl_certificate     /etc/nginx/ssl/fullchain3.pem;
    ssl_certificate_key /etc/nginx/ssl/privatekey3.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers EECDH+AESGCM:EDH+AESGCM;

    # Server-level proxy timeouts (API locations override to 600s where needed)
    proxy_read_timeout    300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout    300s;

    # -----------------------------------------------------------------------
    # BLOCK: Legacy disk-based asset paths
    # All PDFs and images are in Postgres binary storage ΓÇö use /api/asset/:id
    # -----------------------------------------------------------------------
    location ^~ /uploads/ {
        return 410 '{"error":"Asset storage has migrated to Postgres binary. Use /api/asset/:id"}';
        add_header Content-Type application/json;
    }

    # -----------------------------------------------------------------------
    # Nginx stub_status ΓÇö internal metrics only (used by check_nginx_concurrency.sh)
    # -----------------------------------------------------------------------
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1;
        deny  all;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # 1. STRIDE Dashboard (Root) @ 3002
    # -----------------------------------------------------------------------
    location = / {
        if ($http_user_agent ~* "HealthProbe|Azure|LoadBalancer|TrafficManager") {
            return 200 'healthy';
        }
        proxy_pass http://stride_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://stride_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 2. OpDash Frontend @ static files
    # -----------------------------------------------------------------------
    location /opdash/ {
        alias /var/www/html/opdash/;
        try_files $uri $uri/ /opdash/index.html;
    }

    # -----------------------------------------------------------------------
    # 2b. OpDash API @ 3001
    # -----------------------------------------------------------------------
    location /opdash/api/ {
        proxy_pass http://opdash_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # 3. Staging ΓÇö Service Worker (no-cache)
    # -----------------------------------------------------------------------
    location /insighted-staging/sw.js {
        alias /var/www/html/InsightEd-Staging/dist/sw.js;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
        proxy_no_cache 1;
    }

    # -----------------------------------------------------------------------
    # 3b. Staging Frontend (static assets served by Nginx)
    # -----------------------------------------------------------------------
    location /insighted-staging/ {
        alias /var/www/html/InsightEd-Staging/dist/;
        try_files $uri $uri/ /insighted-staging/index.html;
    }

    # -----------------------------------------------------------------------
    # 3c. Staging Binary Asset Cache ΓÇö GET /insighted-staging/api/asset/:id
    # Micro-cache: 10 min TTL, serves stale on error/timeout (resilient reads)
    # -----------------------------------------------------------------------
    location ~ ^/insighted-staging/api/asset/(.*)$ {
        proxy_pass http://staging_backend/api/asset/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache             binary_cache;
        proxy_cache_valid       200 10m;
        proxy_cache_valid       404 1m;
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_lock        on;
        proxy_cache_methods     GET;
        proxy_cache_key         "$request_uri";
        add_header              X-Cache-Status $upstream_cache_status;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # -----------------------------------------------------------------------
    # 3d. Staging API @ 5001 (all other routes)
    # -----------------------------------------------------------------------
    location /insighted-staging/api/ {
        proxy_pass http://staging_backend/api/;
        client_max_body_size    100M;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   600s;
        client_body_timeout     600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admission Control (Staging)
        limit_conn addr_limit 200; # Increased for stress testing
    }

    # -----------------------------------------------------------------------
    # 4. Production Frontend (static assets served by Nginx)
    # -----------------------------------------------------------------------
    location /insighted/ {
        alias /var/www/html/InsightEd-Mobile-PWA/dist/;
        try_files $uri $uri/ /insighted/index.html;
    }

    # -----------------------------------------------------------------------
    # 4b. Production Binary Asset Cache ΓÇö GET /insighted/api/asset/:id
    # -----------------------------------------------------------------------
    location ~ ^/insighted/api/asset/(.*)$ {
        proxy_pass http://production_backend/api/asset/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache             binary_cache;
        proxy_cache_valid       200 10m;
        proxy_cache_valid       404 1m;
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_lock        on;
        proxy_cache_methods     GET;
        proxy_cache_key         "$request_uri";
        add_header              X-Cache-Status $upstream_cache_status;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # -----------------------------------------------------------------------
    # 4c. Production API @ 5000
    # -----------------------------------------------------------------------
    location /insighted/api/ {
        proxy_pass http://production_backend/api/;
        client_max_body_size    100M;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   600s;
        client_body_timeout     600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admission Control (Production)
        limit_conn addr_limit 100; # Increased from 50
        limit_req  zone=req_limit burst=200 nodelay; # Burst increased from 100
    }

    # -----------------------------------------------------------------------
    # 5. Legacy/Generic API ΓÇö Binary Asset Cache ΓÇö GET /api/asset/:id
    # -----------------------------------------------------------------------
    location ~ ^/api/asset/(.*)$ {
        proxy_pass http://production_backend/api/asset/$1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache             binary_cache;
        proxy_cache_valid       200 10m;
        proxy_cache_valid       404 1m;
        proxy_cache_use_stale   error timeout updating;
        proxy_cache_lock        on;
        proxy_cache_methods     GET;
        proxy_cache_key         "$request_uri";
        add_header              X-Cache-Status $upstream_cache_status;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # -----------------------------------------------------------------------
    # 5b. Legacy/Generic API ΓÇö all other routes @ 5000
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://production_backend/api/;
        client_max_body_size    100M;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_connect_timeout   600s;
        client_body_timeout     600s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Admission Control (Legacy)
        limit_conn addr_limit 100;
        limit_req  zone=req_limit burst=200 nodelay;
    }

    # -----------------------------------------------------------------------
    # Security: block hidden files (.env, .git, etc.)
    # -----------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log  off;
        log_not_found off;
    }
# include /etc/nginx/sites-available/hq-cc.conf;

    # === HQ + COMMAND CENTER PROXY (injected) ===
    location /insighted-hq/ {
        alias /var/www/html/insighted-hq/;
        try_files $uri $uri/ /insighted-hq/index.html;
        location ~* /insighted-hq/index\.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
        }
    }
    location /insighted-hq/api/ {
        proxy_pass http://127.0.0.1:3005/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    location /command-center/ {
        alias /var/www/html/command-center-tools/;
        try_files $uri $uri/ /command-center/index.html;
    }
    location /command-center/api/ {
        proxy_pass http://127.0.0.1:3006/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    # === END HQ + COMMAND CENTER PROXY ===
}
